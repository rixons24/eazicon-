<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversation | Ezicon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdfefe;
    --bg-raised: #f2f6f8;
    --bg-card: #ffffff;
    --border: rgba(10,46,74,0.1);
    --border-strong: rgba(10,46,74,0.2);
    --text: #000000;
    --text-dim: rgba(10,46,74,0.7);
    --text-faint: rgba(10,46,74,0.45);
    --navy: #0a2e4a;
    --teal: #19748a;
    --mint: #a6f5c0;
    --mint-deep: #5fc48a;
    --danger: #b0392f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  header {
    background: var(--navy); color: #fff; padding: 14px 24px;
    display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  }
  header a.back { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 4px; }
  header a.back:hover { color: #fff; }
  header .title { font-size: 15px; font-weight: 600; }
  header .meta { font-size: 12px; color: rgba(255,255,255,0.65); margin-top: 1px; }
  .header-spacer { flex: 1; }
  .refresh-btn {
    background: rgba(255,255,255,0.12); color: #fff; border: none; border-radius: 8px;
    padding: 7px 14px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .refresh-btn:hover { background: rgba(255,255,255,0.2); }

  main {
    flex: 1; overflow-y: auto; padding: 24px; display: flex; justify-content: center;
  }
  .thread-wrap { width: 100%; max-width: 640px; }
  .thread-msg {
    max-width: 78%; margin-bottom: 14px; animation: msgIn 0.25s ease;
  }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .thread-msg.guest { margin-right: auto; }
  .thread-msg.agent, .thread-msg.staff { margin-left: auto; }
  .thread-role {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    margin-bottom: 4px; color: var(--text-faint);
  }
  .thread-msg.guest .thread-role { text-align: left; }
  .thread-msg.agent .thread-role, .thread-msg.staff .thread-role { text-align: right; color: var(--teal); }
  .thread-bubble {
    padding: 12px 16px; border-radius: 14px; font-size: 14.5px; line-height: 1.5;
  }
  .thread-msg.guest .thread-bubble { background: var(--bg-card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .thread-msg.agent .thread-bubble, .thread-msg.staff .thread-bubble { background: var(--navy); color: #fff; border-bottom-right-radius: 4px; }
  .thread-translation {
    font-size: 12.5px; color: var(--text-faint); font-style: italic; margin-top: 5px; padding: 0 4px;
  }
  .thread-msg.agent .thread-translation, .thread-msg.staff .thread-translation { text-align: right; }
  .thread-tier {
    display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.03em; padding: 1px 7px; border-radius: 4px; margin-bottom: 4px;
  }
  .thread-tier.urgent { background: rgba(176,57,47,0.14); color: var(--danger); }
  .thread-tier.needs_approval { background: rgba(217,119,6,0.15); color: #d97706; }
  .thread-tier.human_requested { background: rgba(25,116,138,0.14); color: var(--teal); }
  .thread-time { font-size: 11px; color: var(--text-faint); margin-top: 3px; }
  .thread-msg.agent .thread-time, .thread-msg.staff .thread-time { text-align: right; }

  .loading, .empty { text-align: center; padding: 60px 20px; color: var(--text-faint); font-size: 14px; }

  footer {
    border-top: 1px solid var(--border); padding: 14px 24px; background: var(--bg-card); flex-shrink: 0;
  }
  .reply-row { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
  .reply-row input {
    flex: 1; padding: 11px 16px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--border-strong); border-radius: 22px; background: var(--bg);
  }
  .reply-row input:focus { outline: none; border-color: var(--teal); }
  .reply-row button {
    padding: 10px 22px; background: var(--navy); color: #fff; border: none; border-radius: 22px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.2s ease;
  }
  .reply-row button:hover { background: var(--teal); }
  .reply-row button:disabled { background: var(--text-faint); cursor: not-allowed; }
  .reply-status { max-width: 640px; margin: 6px auto 0; font-size: 12.5px; color: var(--danger); text-align: center; }
</style>
</head>
<body>

<header>
  <a href="dashboard" class="back">&larr; Dashboard</a>
  <div>
    <div class="title">Conversation</div>
    <div class="meta" id="headerMeta">Loading...</div>
  </div>
  <div class="header-spacer"></div>
  <button class="refresh-btn" onclick="loadThread()">&#8635; Refresh</button>
</header>

<main>
  <div class="thread-wrap" id="threadWrap">
    <div class="loading">Loading conversation...</div>
  </div>
</main>

<footer>
  <div class="reply-row">
    <input type="text" id="replyInput" placeholder="Type a reply, sent in the guest's language automatically" autocorrect="on" autocapitalize="sentences" spellcheck="true">
    <button id="replyBtn" onclick="sendReply()">Send</button>
  </div>
  <p class="reply-status" id="replyStatus"></p>
</footer>

<script>
  const API_BASE = location.origin;
  const TOKEN = localStorage.getItem('ezicon_token');
  const params = new URLSearchParams(location.search);
  const conversationId = params.get('id');

  if (!TOKEN) {
    window.location.href = 'signin';
  }
  if (!conversationId) {
    document.getElementById('threadWrap').innerHTML = '<div class="empty">No conversation specified.</div>';
    throw new Error('missing conversation id');
  }

  async function api(path, opts = {}) {
    const res = await fetch(`${API_BASE}${path}`, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${TOKEN}`,
        ...(opts.headers || {}),
      },
    });
    if (res.status === 401) { window.location.href = 'signin'; throw new Error('session expired'); }
    return res;
  }

  const tierLabel = { urgent: 'Urgent', needs_approval: 'Needs attention', human_requested: 'Wants a human', itinerary: 'Trip planning' };
  const roleLabel = { guest: 'Guest', agent: 'Concierge', staff: 'Staff' };

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Same defense-in-depth as widget-ui.html: the classification prompt tells
  // the LLM never to use markdown, but it doesn't always comply, so strip
  // common artifacts rather than showing staff literal asterisks.
  function stripMarkdown(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '$1')
      .replace(/\*(.*?)\*/g, '$1')
      .replace(/^#{1,6}\s+/gm, '')
      .replace(/^[-•]\s+/gm, '');
  }

  async function loadThread() {
    const wrap = document.getElementById('threadWrap');
    try {
      const res = await api(`/dashboard/conversations/${conversationId}/messages`);
      const data = await res.json();
      const messages = data.messages || [];

      if (!messages.length) {
        wrap.innerHTML = '<div class="empty">No messages in this conversation yet.</div>';
        document.getElementById('headerMeta').textContent = 'Empty conversation';
        return;
      }

      const first = messages[0];
      const channel = (first.channel || 'web').toUpperCase();
      const lang = first.guest_language ? first.guest_language.toUpperCase() : null;
      document.getElementById('headerMeta').textContent = `${channel}${lang ? ' · ' + lang : ''} · ${messages.length} message${messages.length === 1 ? '' : 's'}`;

      wrap.innerHTML = messages.map(m => {
        const tierBadge = (m.role === 'guest' && m.tier && tierLabel[m.tier])
          ? `<div class="thread-tier ${m.tier}">${tierLabel[m.tier]}</div>` : '';
        const translation = (m.content_english && m.content_english !== m.content_original)
          ? `<div class="thread-translation">&rarr; ${escapeHtml(stripMarkdown(m.content_english))}</div>` : '';
        const time = new Date(m.created_at).toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'});
        return `
          <div class="thread-msg ${m.role}">
            <div class="thread-role">${roleLabel[m.role] || m.role}</div>
            ${tierBadge}
            <div class="thread-bubble">${escapeHtml(stripMarkdown(m.content_original))}</div>
            ${translation}
            <div class="thread-time">${time}</div>
          </div>`;
      }).join('');

      document.querySelector('main').scrollTop = document.querySelector('main').scrollHeight;
    } catch (e) {
      wrap.innerHTML = '<div class="empty">Failed to load this conversation.</div>';
    }
  }

  async function sendReply() {
    const input = document.getElementById('replyInput');
    const btn = document.getElementById('replyBtn');
    const status = document.getElementById('replyStatus');
    const text = input.value.trim();
    if (!text) return;
    btn.disabled = true;
    input.disabled = true;
    status.textContent = '';
    try {
      const res = await api(`/dashboard/conversations/${conversationId}/reply`, {
        method: 'POST', body: JSON.stringify({ text }),
      });
      if (!res.ok) throw new Error('Send failed');
      input.value = '';
      await loadThread();
    } catch (e) {
      status.textContent = 'Failed to send. Please try again.';
    } finally {
      btn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }

  document.getElementById('replyInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendReply(); });

  loadThread();
  // Light polling so a manager watching this page sees new guest activity
  // without manually refreshing.
  setInterval(loadThread, 15000);
</script>

</body>
</html>
