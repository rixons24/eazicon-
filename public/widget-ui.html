<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-raised: #f2f6f8;
    --border: rgba(10,46,74,0.08);
    --text: #0a2e4a;
    --text-dim: rgba(10,46,74,0.65);
    --text-faint: rgba(10,46,74,0.42);
    --navy: #0a2e4a;
    --teal: #19748a;
    --mint: #a6f5c0;
    --mint-deep: #5fc48a;
    --danger: #b0392f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text); background: var(--bg); }
  body { display: flex; flex-direction: column; overflow: hidden; }

  header {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  header .logo {
    width: 32px; height: 32px; border-radius: 8px; background: var(--navy);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    flex-shrink: 0;
  }
  header .logo img { width: 100%; height: 100%; object-fit: cover; }
  header .logo-fallback { color: var(--mint); font-weight: 700; font-size: 14px; }
  header .hotel-info { flex: 1; min-width: 0; }
  header .hotel-name { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .hotel-status { font-size: 11.5px; color: var(--mint-deep); display: flex; align-items: center; gap: 4px; }
  header .hotel-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--mint-deep); }

  .messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg { max-width: 85%; animation: msgIn 0.3s ease; }
  .msg.guest { align-self: flex-end; }
  .msg.agent { align-self: flex-start; }
  .msg-bubble { font-size: 14px; padding: 10px 14px; border-radius: 14px; line-height: 1.45; word-wrap: break-word; }
  .msg.guest .msg-bubble { background: var(--navy); color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent .msg-bubble { background: var(--bg-raised); color: var(--text); border-bottom-left-radius: 4px; }
  .msg-tier {
    font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 5px;
    margin-bottom: 3px; letter-spacing: 0.02em; text-transform: uppercase; display: inline-block;
  }
  .msg-tier.auto { background: rgba(25,116,138,0.14); color: var(--teal); }
  .msg-tier.needs_approval { background: rgba(166,245,192,0.4); color: var(--navy); }
  .msg-tier.urgent { background: rgba(176,57,47,0.14); color: var(--danger); }
  .msg-tier.itinerary { background: rgba(166,245,192,0.4); color: var(--navy); }

  /* ---- In-chat itinerary picker ---- */
  .itinerary-card {
    background: var(--bg-raised); border-radius: 14px; padding: 14px;
    max-width: 92%; align-self: flex-start; margin-top: 2px;
  }
  .itinerary-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .itinerary-chip {
    border: 1px solid rgba(10,46,74,0.15); background: #fff; color: var(--text-dim);
    border-radius: 100px; padding: 7px 13px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 5px;
  }
  .itinerary-chip:hover { border-color: var(--teal); color: var(--navy); }
  .itinerary-chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .itinerary-build-btn {
    width: 100%; margin-top: 8px; padding: 9px; background: var(--navy); color: #fff;
    border: none; border-radius: 10px; font-size: 13px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: background 0.2s ease;
  }
  .itinerary-build-btn:hover { background: var(--teal); }
  .itinerary-build-btn:disabled { background: var(--text-faint); cursor: not-allowed; }
  .itinerary-plan { margin-top: 4px; }
  .itinerary-stop {
    display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(10,46,74,0.08);
  }
  .itinerary-stop:last-child { border-bottom: none; }
  .itinerary-stop-time { font-size: 11.5px; color: var(--text-faint); min-width: 40px; padding-top: 1px; }
  .itinerary-stop-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .itinerary-stop-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; }
  .itinerary-partner-tag {
    display: inline-block; background: var(--mint); color: var(--navy); font-size: 9.5px;
    font-weight: 700; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-left: 5px;
  }
  .itinerary-empty { font-size: 13px; color: var(--text-faint); font-style: italic; padding: 8px 0; }

  .typing {
    display: flex; gap: 4px; padding: 12px 14px; background: var(--bg-raised);
    border-radius: 14px; border-bottom-left-radius: 4px; align-self: flex-start; width: fit-content;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint);
    animation: typingDot 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingDot { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  @keyframes msgIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .input-row {
    display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border);
    background: var(--bg); flex-shrink: 0;
  }
  .input-row input {
    flex: 1; border: 1px solid var(--border); border-radius: 22px;
    padding: 10px 16px; font-size: 14px; font-family: inherit; color: var(--text);
    background: var(--bg-raised); outline: none;
    transition: border-color 0.2s ease;
  }
  .input-row input:focus { border-color: var(--teal); background: var(--bg); }
  .input-row input::placeholder { color: var(--text-faint); }
  .send-btn {
    width: 42px; height: 42px; border-radius: 50%; background: var(--navy);
    color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease; flex-shrink: 0;
  }
  .send-btn:hover { background: var(--teal); }
  .send-btn:disabled { background: var(--text-faint); cursor: not-allowed; }
  .send-btn svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .powered {
    text-align: center; padding: 6px; font-size: 10px; color: var(--text-faint);
    flex-shrink: 0; background: var(--bg); border-top: 1px solid var(--border);
  }
  .powered a { color: inherit; text-decoration: none; }
  .powered a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <div class="logo" id="brandLogo"><span class="logo-fallback" id="brandInitial">·</span></div>
  <div class="hotel-info">
    <div class="hotel-name" id="agentTitle">Concierge</div>
    <div class="hotel-status" id="hotelSubtitle">Ready to help</div>
  </div>
</header>

<div class="messages" id="messages"></div>

<div class="input-row">
  <input type="text" id="input" placeholder="Type in any language..." autofocus>
  <button class="send-btn" id="sendBtn" aria-label="Send">
    <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
  </button>
</div>

<div class="powered">Powered by <a href="https://eazicon.onrender.com" target="_blank">Ezicon</a></div>

<script>
  // ---- Bootstrap: parse hotelId from URL, load branding, restore session ----
  const params = new URLSearchParams(location.search);
  const hotelId = params.get('hotelId');
  if (!hotelId) {
    document.body.innerHTML = '<p style="padding:24px;text-align:center;color:#b0392f;font-family:sans-serif;">Missing hotelId — check your embed snippet.</p>';
    throw new Error('missing hotelId');
  }

  // Same-origin API base — we're served from the backend so relative paths work
  const API_BASE = location.origin;
  // Session persists across page loads via localStorage, scoped per hotel so a
  // guest visiting two different properties gets separate conversations.
  const SESSION_KEY = `ezicon_session_${hotelId}`;
  let sessionId = localStorage.getItem(SESSION_KEY);
  let lastDetectedLanguage = 'en'; // updated from every /message response

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  // ---- Bootstrap: load branding for styling, then either replay the guest's
  // actual conversation history (if this session already has one) or show
  // the fresh greeting. Previously this always showed the greeting and never
  // checked for history, so a page refresh looked like the chat had reset
  // even though the backend still had the whole conversation. ----
  async function bootstrapChat() {
    let brand = {};
    try {
      const r = await fetch(`${API_BASE}/branding?hotelId=${encodeURIComponent(hotelId)}`);
      if (r.ok) brand = await r.json();
    } catch { /* fall through with defaults below */ }

    const hotelName = brand.name || 'this property';
    const agentName = brand.agentName || `${hotelName} Assistant`;
    document.getElementById('agentTitle').textContent = agentName;
    document.getElementById('hotelSubtitle').textContent = `Ready to help · ${hotelName}`;
    document.title = agentName;
    document.getElementById('brandInitial').textContent = agentName.charAt(0).toUpperCase();
    if (brand.logoUrl) {
      document.getElementById('brandLogo').innerHTML = `<img src="${brand.logoUrl}" alt="${hotelName} logo">`;
    }
    if (brand.primaryColor) {
      document.documentElement.style.setProperty('--navy', brand.primaryColor);
    }

    // Only bother checking for history if we actually have a saved session —
    // a brand-new visitor has never had one, so skip the request entirely.
    let history = [];
    if (sessionId) {
      try {
        const r = await fetch(`${API_BASE}/conversation-history?hotelId=${encodeURIComponent(hotelId)}&sessionId=${encodeURIComponent(sessionId)}`);
        if (r.ok) {
          const data = await r.json();
          history = data.messages || [];
        }
      } catch { /* treat as no history — greeting still shows below */ }
    }

    if (history.length) {
      // Replay exactly what was said, in order. Note: if the guest was
      // mid-way through the itinerary picker when they left, we don't
      // reconstruct the interactive chips here — their prior selections
      // aren't stored — we just show that the prompt happened as plain text.
      // They can simply ask again to get a fresh picker.
      history.forEach(m => {
        if (m.role === 'guest') addGuestMessage(m.content_original);
        else addAgentMessage(m.content_original, m.tier);
      });
    } else {
      addAgentMessage(`Hi! I'm ${agentName}. Ask me anything about your stay — in any language.`, null);
    }
  }

  bootstrapChat();

  // ---- Message rendering ----
  const tierLabel = { auto: 'Auto answered', needs_approval: 'Draft for staff', urgent: 'Urgent, escalated', limit_reached: 'Limit reached', itinerary: 'Trip planning' };

  // Defense-in-depth: the classification prompt tells the LLM never to use
  // markdown (this widget has no markdown renderer — it's plain textContent),
  // but LLMs don't always follow formatting instructions perfectly. Strip the
  // common artifacts so a stray "**bold**" doesn't show literal asterisks.
  function stripMarkdown(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '$1')   // **bold** -> bold
      .replace(/\*(.*?)\*/g, '$1')       // *italic* -> italic
      .replace(/^#{1,6}\s+/gm, '')       // # headers -> plain
      .replace(/^[-•]\s+/gm, '');        // leading bullet markers -> plain
  }

  function addGuestMessage(text) {
    const el = document.createElement('div');
    el.className = 'msg guest';
    el.innerHTML = `<div class="msg-bubble"></div>`;
    el.querySelector('.msg-bubble').textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addAgentMessage(text, tier) {
    const el = document.createElement('div');
    el.className = 'msg agent';
    const tierMarkup = tier ? `<span class="msg-tier ${tier}">${tierLabel[tier] || tier}</span><br>` : '';
    el.innerHTML = `${tierMarkup}<div class="msg-bubble"></div>`;
    el.querySelector('.msg-bubble').textContent = stripMarkdown(text);
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'typing'; el.id = 'typing';
    el.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function hideTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  // ---- Send ----
  async function handleSend() {
    const text = inputEl.value.trim();
    if (!text) return;
    addGuestMessage(text);
    inputEl.value = '';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(`${API_BASE}/message`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          hotelId,
          guestMessage: text,
          sessionId, // null on first message; backend issues one
        }),
      });
      hideTyping();
      if (!res.ok) {
        addAgentMessage("Sorry, having trouble reaching the concierge right now. Please try again in a moment.", 'urgent');
        return;
      }
      const data = await res.json();
      if (data.sessionId && data.sessionId !== sessionId) {
        sessionId = data.sessionId;
        localStorage.setItem(SESSION_KEY, sessionId);
      }
      if (data.detectedLanguage) lastDetectedLanguage = data.detectedLanguage;
      // Widget shows the guest-facing reply directly (already in their language
      // from the backend). No English/translation split needed here — that
      // split is a marketing-demo feature on the landing page.
      if (data.tier === 'itinerary') {
        addAgentMessage(data.guestReply, data.tier);
        addItineraryPicker();
      } else {
        addAgentMessage(data.guestReply, data.tier);
      }
    } catch (err) {
      hideTyping();
      addAgentMessage("Couldn't reach the concierge — check your connection.", 'urgent');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // ---- Itinerary picker: renders as its own chat card, calls the real
  // /itinerary endpoint, and shows the resulting day plan inline. This is
  // the piece that was previously missing — the backend endpoint existed
  // but nothing in conversation ever surfaced it to a guest. ----
  const ITINERARY_OPTIONS = [
    { id: 'snorkel', label: 'Snorkeling', icon: '🤿' },
    { id: 'safari', label: 'Safari', icon: '🦁' },
    { id: 'culture', label: 'Culture & heritage', icon: '🏛️' },
    { id: 'food', label: 'Local food', icon: '🍽️' },
    { id: 'spa', label: 'Spa & relax', icon: '💆' },
    { id: 'nightlife', label: 'Nightlife', icon: '🌙' },
  ];

  function addItineraryPicker() {
    const selected = new Set();
    const card = document.createElement('div');
    card.className = 'msg agent';
    card.innerHTML = `
      <div class="itinerary-card">
        <div class="itinerary-chips">
          ${ITINERARY_OPTIONS.map(o => `<button class="itinerary-chip" data-id="${o.id}">${o.icon} ${o.label}</button>`).join('')}
        </div>
        <button class="itinerary-build-btn" disabled>Choose at least one interest</button>
      </div>`;
    messagesEl.appendChild(card);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    const buildBtn = card.querySelector('.itinerary-build-btn');
    card.querySelectorAll('.itinerary-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const id = chip.dataset.id;
        if (selected.has(id)) { selected.delete(id); chip.classList.remove('on'); }
        else { selected.add(id); chip.classList.add('on'); }
        buildBtn.disabled = selected.size === 0;
        buildBtn.textContent = selected.size === 0 ? 'Choose at least one interest' : `Build my day (${selected.size} picked)`;
      });
    });

    buildBtn.addEventListener('click', async () => {
      buildBtn.disabled = true;
      buildBtn.textContent = 'Building your plan...';
      card.querySelectorAll('.itinerary-chip').forEach(c => c.style.pointerEvents = 'none');
      try {
        const res = await fetch(`${API_BASE}/itinerary`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hotelId, interests: Array.from(selected), guestLanguage: lastDetectedLanguage }),
        });
        const data = await res.json();
        renderItineraryPlan(data.activities || [], data.emptyMessage);
      } catch (e) {
        renderItineraryPlan([]);
      }
    });
  }

  function renderItineraryPlan(activities, emptyMessage) {
    const card = document.createElement('div');
    card.className = 'msg agent';
    if (!activities.length) {
      const fallback = "No matching options on file yet for those interests — ask at the front desk and we'll help you plan something.";
      card.innerHTML = `<div class="itinerary-card"><div class="itinerary-empty">${escapeHtml(emptyMessage || fallback)}</div></div>`;
    } else {
      const rows = activities.map(a => `
        <div class="itinerary-stop">
          <div class="itinerary-stop-time">${a.isMultiDay ? 'Full day' : ''}</div>
          <div>
            <div class="itinerary-stop-name">${escapeHtml(a.name)}${a.source === 'hotel_partner' ? '<span class="itinerary-partner-tag">Partner</span>' : ''}</div>
            <div class="itinerary-stop-meta">${a.price ? '$' + a.price + ' pp' : 'Price on request'}${a.duration_days > 1 ? ' · ' + a.duration_days + ' days' : ''}</div>
          </div>
        </div>`).join('');
      card.innerHTML = `<div class="itinerary-card"><div class="itinerary-plan">${rows}</div></div>`;
    }
    messagesEl.appendChild(card);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  sendBtn.addEventListener('click', handleSend);
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });
</script>

</body>
</html>
